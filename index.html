<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --red: #ff263e;
    --dark-red: #a9001c;
    --bg: #090506;
    --white: #ffffff;
    --muted: #a99da0;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100svh;
    background:
        radial-gradient(ellipse at 50% 8%, rgba(255, 25, 55, .17), transparent 48%),
        radial-gradient(ellipse at 100% 90%, rgba(150, 0, 25, .13), transparent 40%),
        var(--bg);
    color: white;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    padding: 16px;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .12;
    background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 35px 35px;
}

.wrapper {
    width: 100%;
    max-width: 420px;
    position: relative;
    z-index: 2;
    animation: appear .8s ease both;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
}

.card {
    width: 100%;
    position: relative;
    padding: 24px 21px 20px;
    border: 1px solid rgba(255, 55, 75, .25);
    border-radius: 25px;
    background: linear-gradient(
        155deg,
        rgba(37, 12, 17, .96),
        rgba(12, 7, 9, .98) 65%
    );
    box-shadow:
        0 0 35px rgba(255, 20, 50, .10),
        0 20px 65px rgba(0,0,0,.6),
        inset 0 1px 0 rgba(255,255,255,.07);
    overflow: hidden;
}

.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 18%;
    width: 64%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #ff263e, transparent);
    box-shadow: 0 0 18px #ff263e;
}

.topline {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-bottom: 17px;
}

.live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ff334d;
    box-shadow: 0 0 10px #ff263e;
    animation: blink 1.4s infinite;
}

@keyframes blink {
    50% { opacity: .3; }
}

.topline span:last-child {
    color: #ff6879;
    font-size: 9px;
    letter-spacing: 2.4px;
    font-weight: 800;
}

.logo-box {
    width: 112px;
    height: 112px;
    margin: 0 auto 16px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.logo-box::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(255, 20, 50, .17);
    filter: blur(18px);
    animation: glow 2.5s ease-in-out infinite alternate;
}

@keyframes glow {
    from { transform: scale(.8); opacity: .55; }
    to { transform: scale(1.2); opacity: 1; }
}

.logo-box img {
    position: relative;
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 50%;
    filter: drop-shadow(0 0 12px rgba(255, 35, 60, .45));
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    50% { transform: translateY(-4px); }
}

.brand {
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(32px, 9vw, 43px);
    font-weight: 900;
    line-height: .98;
    letter-spacing: .7px;
    text-transform: uppercase;
    background: linear-gradient(180deg, #fff 10%, #ffb5be 48%, #ff263e 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 3px 12px rgba(255, 30, 55, .2));
}

.subtitle {
    text-align: center;
    margin-top: 10px;
    font-size: 10px;
    font-weight: 700;
    color: #c5aeb2;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.divider {
    height: 1px;
    margin: 19px 0;
    background: linear-gradient(90deg, transparent, rgba(255, 40, 65, .55), transparent);
}

.section-label {
    text-align: center;
    color: #ff7585;
    font-size: 9px;
    letter-spacing: 2.5px;
    font-weight: 800;
    margin-bottom: 13px;
}

.features {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.feature {
    min-height: 57px;
    padding: 10px 7px;
    border: 1px solid rgba(255, 55, 75, .16);
    border-radius: 11px;
    background: linear-gradient(135deg, rgba(255, 35, 60, .09), rgba(255,255,255,.018));
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: .3s ease;
}

.feature:hover {
    border-color: rgba(255, 55, 75, .55);
    transform: translateY(-2px);
}

.feature-icon {
    font-size: 17px;
}

.feature-text {
    font-size: 10px;
    line-height: 1.5;
    font-weight: 700;
    color: #f5e8ea;
}

.rating {
    margin-top: 17px;
    padding: 11px;
    border-radius: 11px;
    background: rgba(255, 30, 55, .055);
    border: 1px solid rgba(255, 45, 65, .13);
    text-align: center;
}

.stars {
    color: #ffbd48;
    font-size: 17px;
    letter-spacing: 4px;
    text-shadow: 0 0 10px rgba(255, 170, 30, .3);
}

.rating-text {
    margin-top: 4px;
    color: #c7afb3;
    font-size: 9px;
    letter-spacing: 1.5px;
    font-weight: 700;
}

.join-btn {
    width: 100%;
    height: 57px;
    margin-top: 19px;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(110deg, #a9001c, #ff263e 50%, #c90025);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1.8px;
    cursor: pointer;
    box-shadow:
        0 0 22px rgba(255, 25, 55, .28),
        0 7px 20px rgba(0,0,0,.35);
    transition: transform .25s, box-shadow .25s;
}

.join-btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -110%;
    width: 65%;
    height: 100%;
    transform: skewX(-25deg);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent);
    animation: shine 3s infinite;
}

@keyframes shine {
    100% { left: 150%; }
}

.join-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 32px rgba(255, 25, 55, .5);
}

.join-btn:active {
    transform: scale(.98);
}

.join-btn span {
    position: relative;
    z-index: 1;
}

.join-icon {
    font-size: 16px;
    margin-right: 8px;
    vertical-align: -1px;
}

.note {
    text-align: center;
    font-size: 9px;
    color: #938186;
    margin-top: 11px;
    letter-spacing: .5px;
}

.footer {
    text-align: center;
    margin-top: 17px;
    color: #6f5c61;
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 2px;
}

@media (max-width: 360px) {
    body { padding: 10px; }
    .card { padding: 19px 15px 16px; }
    .logo-box { width: 94px; height: 94px; }
    .brand { font-size: 34px; }
    .divider { margin: 14px 0; }
    .feature { min-height: 52px; }
    .join-btn { height: 53px; }
}

@media (max-height: 680px) {
    body { padding-top: 8px; padding-bottom: 8px; }
    .card { padding-top: 15px; padding-bottom: 14px; }
    .topline { margin-bottom: 10px; }
    .logo-box { width: 76px; height: 76px; margin-bottom: 10px; }
    .brand { font-size: 34px; }
    .divider { margin: 12px 0; }
    .rating { margin-top: 11px; padding: 7px; }
    .join-btn { margin-top: 12px; height: 50px; }
    .footer { margin-top: 10px; }
}
